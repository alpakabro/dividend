name: etf-data
on:
  push:
    branches: [etf-job]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance pandas pyarrow requests
      - run: python tools/etf/fetch_etf.py
        continue-on-error: true
      - name: publish outputs to etf-data branch
        if: always()
        run: |
          mkdir -p out && cd out
          git init -q && git checkout -q -b etf-data
          git config user.name "etf-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "ETF data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" etf-data
